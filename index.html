<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشاريع Hz Bahkali</title>
<meta name="description" content="مستودع المشاريع والأنظمة التقنية — Hz Bahkali">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030806; --panel:rgba(5,16,11,.86); --fg:#c6f7d8; --dim:#5f8f75;
  --g:#00ff9c; --a:#ffb000; --r:#ff3b5c; --line:rgba(0,255,156,.22); --rain:.28;
  --c-android:#ff8a00; --c-sony:#2f8bff; --c-tools:#ff3b5c; --c-ios:#b66dff;
  --mono:'JetBrains Mono',ui-monospace,monospace; --ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#eef6f0;--panel:rgba(255,255,255,.92);--fg:#0b2a1a;--dim:#4d6e5c;--g:#006b3f;--a:#8a5a00;--r:#b00027;--line:rgba(0,107,63,.3);--rain:.12;--c-android:#c25e00;--c-sony:#0b5fd6;--c-tools:#c0002a;--c-ios:#7a2fd0;color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--ar);line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:3px}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:var(--rain);pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:0 18px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);font:12px var(--mono);direction:ltr}
.bar a{color:var(--g)} .bar a:hover{text-decoration:underline}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--r)}.dots i:nth-child(2){background:var(--a)}.dots i:nth-child(3){background:var(--g)}
.tgl{background:none;border:1px solid var(--line);color:var(--g);font:12px var(--mono);padding:3px 10px;border-radius:4px;cursor:pointer}
.hero{padding:52px 0 18px;direction:ltr;text-align:left}
.hero .cmd{font:13px var(--mono);color:var(--dim)} .cmd b{color:var(--g)}
h1{font:700 clamp(38px,10vw,76px)/1.05 var(--mono);color:var(--g);margin:12px 0 6px;letter-spacing:-2px;text-shadow:0 0 18px color-mix(in srgb,var(--g) 55%,transparent)}
.tag{direction:rtl;text-align:right;font-size:17px;color:var(--a);font-weight:600}
.toolbar{margin:26px 0 10px;direction:ltr}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 14px;font:14px var(--mono)}
.find label{color:var(--g);white-space:nowrap}
.find input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;caret-color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{background:transparent;border:1px solid var(--line);color:var(--dim);font:12px var(--mono);padding:6px 12px;border-radius:4px;cursor:pointer}
.android{--c:var(--c-android)}.sony{--c:var(--c-sony)}.tools{--c:var(--c-tools)}.ios{--c:var(--c-ios)}
.chips button{border-color:color-mix(in srgb,var(--c,var(--g)) 50%,transparent)}
.chips button:hover,.chips button[aria-pressed="true"]{background:var(--c,var(--g));color:var(--bg);border-color:var(--c,var(--g))}
.count{font:12px var(--mono);color:var(--dim);margin:14px 0;direction:ltr;text-align:left}
.list{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;transition:.15s}
.card{position:relative;border-color:color-mix(in srgb,var(--c,var(--g)) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--g)) 12%,var(--panel)),var(--panel))}
.card::before{content:'';position:absolute;top:-1px;left:30px;right:30px;height:1px;background:linear-gradient(90deg,transparent,var(--c,var(--g)),transparent)}
.card:hover{border-color:var(--c,var(--g));box-shadow:0 0 24px -6px var(--c,var(--g))}
.ext{font:700 12px var(--mono);color:var(--g);border:1px solid var(--line);border-radius:4px;padding:6px 8px;height:fit-content;direction:ltr;min-width:58px;text-align:center}
.ext{color:var(--c,var(--g));border-color:var(--c,var(--g))}
.card h3{font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card h3 small{font:11px var(--mono);color:var(--dim);border:1px dashed var(--line);padding:0 8px;border-radius:3px}
.card p{color:var(--dim);font-size:14.5px;margin:4px 0 10px}
.run{font:700 13px var(--mono);color:var(--g);direction:ltr;display:inline-block}
.run:hover{text-decoration:underline}.card .run{color:var(--c,var(--g))}.card h3 small{color:var(--c,var(--g));border-color:var(--c,var(--g))}
.badge{font:700 11px var(--ar);background:var(--c,var(--g));color:var(--bg);padding:0 9px;border-radius:3px;line-height:1.7}
.empty{font:14px var(--mono);color:var(--r);direction:ltr;text-align:left;padding:20px 0}
footer{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:12px var(--mono);color:var(--dim);direction:ltr;border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--g)}
@media (max-width:520px){.card{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="bar">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <a href="https://hzhack.github.io/hz/" aria-label="العودة للملف الشخصي">cd ..</a>
  <button class="tgl" id="tgl" aria-label="تبديل الثيم">☾ dark</button>
</div>

<div class="wrap">
  <section class="hero">
    <div class="cmd"><b>hz@bahkali:~$</b> ls -la ./projects</div>
    <h1>projects/</h1>
    <p class="tag">مستودع الأدوات والبرمجيات والحلول التقنية</p>
  </section>

  <section class="toolbar">
    <div class="find"><label>grep -i</label><input id="q" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ابحث..." aria-label="بحث في المشاريع"></div>
    <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
  </section>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <footer><span>© <span id="yr"></span> Hz Bahkali // exit 0</span><a href="https://hzhack.github.io/hz/">cd ~</a></footer>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
$('yr').textContent=new Date().getFullYear();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement,tg=$('tgl');
function setTheme(t){root.dataset.theme=t;tg.textContent=t==='dark'?'☾ dark':'☀ light';try{localStorage.setItem('hz-theme',t)}catch(e){}}
let saved='dark';try{saved=localStorage.getItem('hz-theme')||'dark'}catch(e){}
setTheme(saved==='light'?'light':'dark');
tg.onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

/* [name, ext, category, description, url, run label, featured] */
const P=[
['تعديل سوني 4 (PS4 Host)','.ps4','sony','بوابة استضافة وتعديل أجهزة PlayStation 4 من إصدار 7.00 حتى 13.00 مع إرشادات الحماية.','https://hzhack.github.io/ps4/','launch exploit','جديد'],
['تطبيقات داونلودر (Android TV)','.tv','android','مكتبة أكواد وتطبيقات Downloader للتلفزيون الذكي وأجهزة Android TV مع دعم الريموت.','https://hzhack.github.io/andtv/','launch tv hub','جديد'],
['VETO HUB','.hub','tools','مستودع ومنصة شاملة للمطورين والأدوات البرمجية والأمنية.','https://hz-team.gitlab.io/veto-hub/','execute protocol','تحديث'],
['VETO','.exe','tools','برنامج لإدارة المصاريف المالية ووقف النزيف المالي الفوري.','https://hzhack.github.io/veto/','download module'],
['دكتاتور العمليات','.exe','tools','برنامج Process Freezer لتجميد العمليات المستنزفة لموارد النظام أثناء اللعب.','https://hzhack.github.io/pf/','download module'],
['فحص الملفات (IPA/APK)','.scan','tools','أداة PlusInspector Pro لفحص سلامة وأمن حزم التطبيقات والتأكد من خلوها من التهديدات.','https://hzhack.github.io/apk/','launch scanner'],
['فحص شامل للجوال','.sys','tools','تحليل قوة العتاد وسرعة الشبكة ودقة العرض والمواصفات الدقيقة لجهازك.','https://hzhack.github.io/Info/','initialize scan'],
['مولد الإيميلات المؤقتة','.mail','tools','توليد عناوين إلكترونية مؤقتة ومحمية لحماية خصوصيتك من الرسائل المزعجة.','https://hzhack.github.io/emil/','generate relay'],
['مستشار القيمنق (PC)','.pc','tools','فحص توافق عتاد الكمبيوتر واقتراح ترقيات دقيقة لرفع الأداء ومعدل الإطارات.','https://hzhack.github.io/Pc/','analyze hardware'],
['سناب شات بلس','.ipa','ios','حزم معدلة بميزات حصرية وتحسينات على استقرار وتجربة الاستخدام.','https://hzhack.github.io/snap-hz/','deploy package'],
['متجر تطبيقات بلس (iOS)','.ipa','ios','مستودع تطبيقات معدلة وحزم IPA محسنة لأجهزة iOS.','https://hzhack.github.io/ioss/','access repo'],
['متجر تطبيقات بلس (Android)','.apk','android','مكتبة حزم APK معدلة ومخصصة لأقصى إمكانيات أجهزة أندرويد.','https://hzhack.github.io/Android/','access repo'],
['مواقيت وأذكار','.app','tools','مواقيت الصلاة الدقيقة للمنطقة الشرقية مع حصن المسلم المدمج.','https://hzhack.github.io/muslim/','view protocol'],
['فحص دعم الجلبريك','.jb','ios','فحص توافق إصدار النظام مع أدوات كسر الحماية والجلبريك المتاحة.','https://hzhack.github.io/jil/','run compatibility']
];
const cats=['all','sony','android','ios','tools'];
let cat='all';
const list=$('list'),count=$('count'),q=$('q');
cats.forEach(c=>{const b=document.createElement('button');b.className=c;b.textContent=c;b.setAttribute('aria-pressed',c==='all');b.onclick=()=>{cat=c;[...$('chips').children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();};$('chips').appendChild(b);});

function el(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function render(){
  const k=q.value.trim().toLowerCase();
  const rows=P.filter(p=>(cat==='all'||p[2]===cat)&&(!k||(p[0]+p[1]+p[2]+p[3]).toLowerCase().includes(k)));
  list.textContent='';
  count.textContent=rows.length+' / '+P.length+' entries';
  if(!rows.length){list.appendChild(el('div','empty','grep: no matches — جرّب كلمة ثانية'));return;}
  rows.forEach(p=>{
    const c=el('div','card '+p[2]);
    c.appendChild(el('div','ext',p[1]));
    const b=el('div');
    const h=el('h3','',p[0]);h.appendChild(el('small','',p[2]));if(p[6])h.appendChild(el('span','badge',p[6]));
    b.appendChild(h);b.appendChild(el('p','',p[3]));
    const a=el('a','run','./'+p[5].replace(/ /g,'-')+' →');
    a.href=p[4];a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',p[0]);
    b.appendChild(a);c.appendChild(b);list.appendChild(c);
  });
}
q.addEventListener('input',render);render();

/* matrix rain */
const cv=$('rain'),cx=cv.getContext('2d');
const chars='01アイウエオカキクケコ{}<>/$#=;abcdef'.split('');
let cols,drops,fs=16;
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/fs);drops=Array.from({length:cols},()=>Math.random()*-50);}
size();addEventListener('resize',size);
function draw(){
  const s=getComputedStyle(root);
  cx.fillStyle=s.getPropertyValue('--bg').trim();cx.globalAlpha=.12;cx.fillRect(0,0,cv.width,cv.height);cx.globalAlpha=1;
  cx.fillStyle=s.getPropertyValue('--g').trim();cx.font=fs+'px monospace';
  for(let i=0;i<cols;i++){
    cx.fillText(chars[Math.random()*chars.length|0],i*fs,drops[i]*fs);
    if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
    drops[i]+=.6;
  }
}
if(reduce){draw();}else{setInterval(draw,50);}
})();
</script>
</body>
</html>
